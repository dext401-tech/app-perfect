name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: unzip -q MCTV.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: MCTV
        run: gradle assembleDebug --no-daemon

      - name: Leer version
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' MCTV/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MCTV-debug-apk
          path: MCTV/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: MC TV ${{ steps.ver.outputs.name }}
          files: MCTV/app/build/outputs/apk/debug/app-debug.apk
